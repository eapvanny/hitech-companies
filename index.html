<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <title>Typing and Deleting Animation</title>
  <style>
    body {
      background-color: #111;
      color: #0f0;
      font-family: 'Courier New', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .text {
      font-size: 24px;
      border-right: 2px solid #0f0;
      white-space: nowrap;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="text" id="animatedText"></div>

  <script>
    const text = "Hi-Tech ដើម្បីសុខភាព និងសុខុមាលភាពរបស់អ្នក។";
    const element = document.getElementById('animatedText');
    let index = 0;
    let isDeleting = false;

    function typeEffect() {
      if (!isDeleting) {
        element.textContent = text.substring(0, index + 1);
        index++;

        if (index === text.length) {
          setTimeout(() => isDeleting = true, 1000); // Pause before deleting
        }
      } else {
        element.textContent = text.substring(0, index - 1);
        index--;

        if (index === 0) {
          isDeleting = false;
        }
      }

      setTimeout(typeEffect, isDeleting ? 50 : 100); // Speed: slower type, faster delete
    }

    // Start the animation
    typeEffect();
  </script>

</body>
</html>
